# WealthKart indexer (ADR 0036): caches public circle events in D1 so charts and the activity
# feed load fast. It holds no secrets and no personal data, only what anyone can read on-chain.
name = "wealthkart-indexer"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Catch up every minute; every API request also catches up a little first.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "wealthkart-indexer"
# Owner action at deploy time: `wrangler d1 create wealthkart-indexer`, paste the id here.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Fuji until mainnet. Use a provider URL as a secret (`wrangler secret put RPC_URL`) for heavy use.
CHAIN_ID = "43113"
RPC_URL = "https://api.avax-test.network/ext/bc/C/rpc"
# Set from packages/sdk/src/deployments/43113.json after the Fuji deploy.
FACTORY = "0x0000000000000000000000000000000000000000"
FROM_BLOCK = "0"
# Public Avalanche RPCs cap eth_getLogs at 2048 blocks.
LOG_CHUNK = "2048"
# Blocks to stay behind the tip. Avalanche finalises in about a second, so 1 is plenty.
CONFIRMATIONS = "1"
# D1 free tier: 500 MB per database. Stop storing new events at this many MB (ADR 0047).
D1_SOFT_LIMIT_MB = "450"
# Payment reminders by Web Push (ADR 0052). Owner action: `npx web-push generate-vapid-keys`
# (or any P-256 key pair), paste the public key here and in the web build's
# NEXT_PUBLIC_VAPID_PUBLIC_KEY, and `wrangler secret put VAPID_PRIVATE_KEY` for the private one.
# Reminders stay off (the push API answers 503) until both are set.
VAPID_PUBLIC_KEY = ""
# Contact for push services: a URL, so no email address is needed anywhere.
VAPID_SUBJECT = "https://wealthkart.pages.dev"
# Sites allowed in signed reminder messages (Pages production and its preview subdomains).
APP_DOMAINS = "wealthkart.pages.dev,*.wealthkart.pages.dev"

# Avalanche mainnet (ADR 0051): `wrangler deploy --env mainnet`. Own D1 database and factory.
# Keep this section before [env.e2e]: the deploy workflow reads it up to that line.
[env.mainnet]
name = "wealthkart-indexer-mainnet"
[env.mainnet.triggers]
crons = ["* * * * *"]
[env.mainnet.vars]
CHAIN_ID = "43114"
RPC_URL = "https://api.avax.network/ext/bc/C/rpc"
# Set from packages/sdk/src/deployments/43114.json after the mainnet deploy.
FACTORY = "0x0000000000000000000000000000000000000000"
FROM_BLOCK = "0"
LOG_CHUNK = "2048"
CONFIRMATIONS = "1"
D1_SOFT_LIMIT_MB = "450"
# Own key pair for mainnet (`wrangler secret put VAPID_PRIVATE_KEY --env mainnet`).
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "https://wealthkart.pages.dev"
APP_DOMAINS = "wealthkart.pages.dev"
[[env.mainnet.d1_databases]]
binding = "DB"
database_name = "wealthkart-indexer-mainnet"
# Owner action: `wrangler d1 create wealthkart-indexer-mainnet`, paste the id here.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# Local E2E against anvil (apps/web/e2e). Started by e2e/indexer.mjs, which passes the real
# anvil URL with `--var RPC_URL:...` (ports are configurable, ADR 0053); this one is the default.
# It also passes a fresh VAPID key pair, APP_DOMAINS for the configured web port and
# PUSH_EXTRA_ORIGINS for a fake push service on 127.0.0.1 (ADR 0052). Never copy those to
# Fuji or mainnet.
[env.e2e]
name = "wealthkart-indexer-e2e"
[env.e2e.vars]
CHAIN_ID = "43113"
RPC_URL = "http://127.0.0.1:8546"
FACTORY = "0x5FbDB2315678afecb367f032d93F642f64180aa3"
FROM_BLOCK = "0"
LOG_CHUNK = "2048"
CONFIRMATIONS = "0"
D1_SOFT_LIMIT_MB = "450"
# Filled by e2e/indexer.mjs with --var for each run.
VAPID_PUBLIC_KEY = ""
VAPID_SUBJECT = "https://wealthkart.pages.dev"
APP_DOMAINS = ""
[[env.e2e.d1_databases]]
binding = "DB"
database_name = "wealthkart-indexer-e2e"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
