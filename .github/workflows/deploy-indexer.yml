name: Deploy indexer

# Manual only, with environment approval (docs/engineering.md §6, ADR 0036). Needs, in the
# `fuji` environment: CLOUDFLARE_API_TOKEN (Workers + D1 edit) and CLOUDFLARE_ACCOUNT_ID.
# Before the first run, create the D1 database (`wrangler d1 create wealthkart-indexer`), put
# its id and the deployed factory address in workers/indexer/wrangler.toml, and commit.
on:
  workflow_dispatch:
    inputs:
      network:
        description: Network the indexer reads
        required: true
        default: fuji
        type: choice
        options: [fuji]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy indexer for ${{ inputs.network }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.network }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wealthkart/sdk build
      - run: pnpm --filter @wealthkart/indexer test
      - name: Refuse placeholder settings
        working-directory: workers/indexer
        run: |
          # Only the production settings (everything before the first [env.*] section).
          top=$(sed '/^\[env\./,$d' wrangler.toml)
          if echo "$top" | grep -q '00000000-0000-0000-0000-000000000000'             || echo "$top" | grep -q '^FACTORY = "0x0000000000000000000000000000000000000000"'; then
            echo "Set the D1 database id and the factory address in wrangler.toml first." >&2
            exit 1
          fi
      - name: Apply D1 migrations
        working-directory: workers/indexer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Deploy the Worker
        working-directory: workers/indexer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Summary
        run: |
          echo "### Indexer deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Set NEXT_PUBLIC_INDEXER_URL in the web build to the Worker URL shown above." >> "$GITHUB_STEP_SUMMARY"
