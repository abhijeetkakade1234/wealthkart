name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: Lint, typecheck, test, build (TS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --filter=!@wealthkart/contracts

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          # forge-std + OpenZeppelin only; OZ's own nested test libs aren't needed
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @wealthkart/contracts
      - run: pnpm lint:sol
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge build --sizes
      - run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci

  slither:
    name: Slither (static analysis)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: crytic/slither-action@v0.4.1
        with:
          target: packages/contracts
          slither-config: packages/contracts/slither.config.json
          fail-on: medium

  lighthouse:
    name: Lighthouse budget (web)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wealthkart/web build
      - name: Run Lighthouse against the static export
        working-directory: apps/web
        run: npx -y @lhci/cli@0.14.0 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/reports
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright + anvil)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - name: Compile contracts (the test chain deploys the real factory)
        run: forge build
        working-directory: packages/contracts
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm e2e
        working-directory: apps/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
